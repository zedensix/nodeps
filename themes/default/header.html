<header class="site-header">
  <div class="topbar">
    <button
      class="icon-button menu-toggle"
      type="button"
      aria-label="Main menu"
      data-tooltip="Main menu"
      aria-controls="main-menu"
      aria-expanded="false"
    >
      <i data-icon="menu"></i>
    </button>
    <a class="brand" data-slot="brand" href="/"></a>
    <button class="search-trigger" type="button" aria-label="Search documentation" data-tooltip="Search">
      <i data-icon="search"></i>
      <span>Search</span>
      <kbd>⌘K</kbd>
    </button>
    <nav class="header-links" aria-label="External links" data-slot="links"></nav>
    <button
      class="icon-button reader-toggle"
      type="button"
      aria-label="Reader mode"
      data-tooltip="Reader mode"
      data-tooltip-align="end"
      data-if="reader"
    >
      <i data-icon="book-open-text"></i>
    </button>
    <details class="theme-picker" data-if="picker">
      <summary class="icon-button" aria-label="Choose a theme" data-tooltip="Choose a theme" data-tooltip-align="end">
        <i data-icon="palette"></i>
      </summary>
      <div class="menu theme-menu" role="menu" data-slot="theme-picker"></div>
    </details>
    <button
      class="icon-button theme-toggle"
      type="button"
      aria-label="Color mode: device"
      data-tooltip="Color mode: device"
      data-tooltip-align="end"
    >
      <i data-icon="monitor"></i>
      <i data-icon="sun"></i>
      <i data-icon="moon"></i>
    </button>
  </div>
  <nav class="category-tabs" aria-label="Sections" data-slot="tabs" data-if="tabs"></nav>
</header>
<div class="main-menu drawer" id="main-menu">
  <div class="drawer-head">
    <a class="brand" data-slot="brand" href="/"></a>
    <button class="icon-button drawer-close" type="button" aria-label="Close menu"><i data-icon="x"></i></button>
  </div>
  <nav class="main-menu-sections" aria-label="Sections" data-slot="tabs" data-if="tabs"></nav>
  <nav class="main-menu-links" aria-label="External links" data-slot="links"></nav>
</div>
