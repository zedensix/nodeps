<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-slot="title">Documentation</title>
    <script>
      try {
        const theme = localStorage.getItem("theme");
        if (theme) {
          document.documentElement.dataset.theme = theme;
        }
        if (localStorage.getItem("reader") === "on") {
          document.documentElement.dataset.reader = "";
        }
        const presetStyle = localStorage.getItem("theme-preset-style");
        if (presetStyle) {
          document.documentElement.style.cssText = presetStyle;
        }
      } catch {}
    </script>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <a class="skip-link" href="#content">Skip to content</a>

    <nodeps-partial name="header"></nodeps-partial>

    <nodeps-partial name="main"></nodeps-partial>

    <div class="scrim" hidden></div>
    <button class="reader-exit" type="button" data-if="reader"><i data-icon="x"></i>Exit reader mode</button>

    <nodeps-partial name="search"></nodeps-partial>
    <nodeps-partial name="editor"></nodeps-partial>
  </body>
</html>
