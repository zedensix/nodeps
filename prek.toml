#:schema https://www.schemastore.org/prek.json
default_install_hook_types = ["pre-commit", "commit-msg", "pre-push"]
exclude = "^icons/"

[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "mixed-line-ending", args = ["--fix=lf"] },
  { id = "check-merge-conflict" },
  { id = "check-case-conflict" },
  { id = "check-yaml" },
  { id = "check-json" },
  { id = "check-toml" },
  { id = "check-added-large-files" },
  { id = "detect-private-key" },
  { id = "check-executables-have-shebangs" },
  { id = "check-shebang-scripts-are-executable" },
  { id = "check-commit-trailers", args = ["--deny", "Co-Authored-By=(?i)claude|anthropic"], stages = ["commit-msg"] },
]

[[repos]]
repo = "local"
hooks = [
  { id = "bun-fmt", name = "bun fmt", entry = "bun fmt", language = "system", types_or = [
    "ts",
    "tsx",
    "javascript",
    "css",
    "html",
    "json",
    "yaml",
    "markdown",
    "toml",
  ] },
  { id = "bun-lint", name = "bun lint", entry = "bun lint", language = "system", types_or = [
    "ts",
    "tsx",
    "javascript",
  ] },
  { id = "bun-test", name = "bun test", entry = "bun test", language = "system", pass_filenames = false, types_or = [
    "ts",
    "tsx",
  ] },
  { id = "bun-check", name = "bun check", entry = "sh -c 'bun install --frozen-lockfile --silent && bun check'", language = "system", pass_filenames = false, types_or = ["ts", "tsx"], stages = ["pre-push"] },
  { id = "max-lines", name = "files stay under 300 lines", entry = "awk 'FNR == 301 { print FILENAME \": more than 300 lines\"; failed = 1 } END { exit failed }'", language = "system", types_or = ["css", "html", "json", "markdown", "yaml", "toml", "shell"] },
  { id = "docs-build", name = "docs build", entry = "bun docs.ts build", language = "system", pass_filenames = false, files = "^(docs/|src/|client/|themes/|docs\\.(ts|yaml)$)" },
  { id = "zizmor", name = "zizmor", entry = "zizmor --min-severity low", language = "system", files = "^\\.github/workflows/" },
  { id = "pinact", name = "pinact", entry = "sh -c 'GITHUB_TOKEN=\"${GITHUB_TOKEN:-$(gh auth token 2>/dev/null)}\" exec pinact run --check --verify-comment \"$@\"' pinact", language = "system", files = "^\\.github/workflows/" },
  { id = "hadolint", name = "hadolint", entry = "hadolint", language = "system", files = "(^|/)Dockerfile$" },
  { id = "binary", name = "compiled binary builds the docs", entry = "sh -c 'mise run compile && ./build/nodeps build'", language = "system", pass_filenames = false, stages = ["pre-push"] },
]
