<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-slot="title">Documentation</title>
    <script>
      try {
        const theme = localStorage.getItem("theme");
        if (theme) {
          document.documentElement.dataset.theme = theme;
        }
        const presetStyle = localStorage.getItem("theme-preset-style");
        if (presetStyle) {
          document.documentElement.style.cssText = presetStyle;
        }
      } catch {}
    </script>
    <link rel="stylesheet" href="./style.css" />
    <script type="module" src="./client.ts"></script>
  </head>
  <body>
    <a class="skip-link" href="#content">Skip to content</a>

    <header class="site-header">
      <div class="topbar">
        <button
          class="icon-button menu-toggle"
          type="button"
          aria-label="Toggle navigation"
          data-tooltip="Toggle navigation"
          aria-controls="sidebar"
          aria-expanded="false"
        >
          <i data-icon="menu"></i>
        </button>
        <a class="brand" data-slot="brand" href="/"></a>
        <button class="search-trigger" type="button" aria-label="Search documentation" data-tooltip="Search">
          <i data-icon="search"></i>
          <span>Search</span>
          <kbd>⌘K</kbd>
        </button>
        <nav class="header-links" aria-label="External links" data-slot="links"></nav>
        <details class="theme-picker">
          <summary
            class="icon-button"
            aria-label="Choose a theme"
            data-tooltip="Choose a theme"
            data-tooltip-align="end"
          >
            <i data-icon="palette"></i>
          </summary>
          <div class="menu theme-menu" role="menu" data-slot="theme-picker"></div>
        </details>
        <button
          class="icon-button theme-toggle"
          type="button"
          aria-label="Color mode: device"
          data-tooltip="Color mode: device"
          data-tooltip-align="end"
        >
          <i data-icon="monitor"></i>
          <i data-icon="sun"></i>
          <i data-icon="moon"></i>
        </button>
      </div>
      <nav class="category-tabs" aria-label="Sections" data-slot="tabs" data-if="tabs"></nav>
    </header>

    <div class="layout">
      <aside class="sidebar" id="sidebar" data-if="sidebar">
        <nav aria-label="Documentation" data-slot="sidebar"></nav>
      </aside>

      <main class="content" id="content">
        <div class="page-header" data-if="page">
          <span class="breadcrumb" data-slot="breadcrumb"></span>
          <div class="page-actions">
            <button class="copy-page" type="button">
              <i data-icon="copy"></i>
              <i data-icon="check"></i>
              <span>Copy page</span>
            </button>
            <details class="actions-menu">
              <summary aria-label="More page actions" data-tooltip="More page actions" data-tooltip-align="end">
                <i data-icon="chevron-down"></i>
              </summary>
              <div class="menu">
                <button class="menu-item" type="button" data-edit-page data-if="editor">
                  <i data-icon="square-pen"></i>
                  <span><strong>Edit this page</strong><small>Change it in a visual editor</small></span>
                </button>
                <a class="menu-item" data-action="markdown" href="#">
                  <i data-icon="file-text"></i>
                  <span><strong>View as Markdown</strong><small>Plain text for LLMs</small></span>
                </a>
                <a
                  class="menu-item"
                  data-prompt="https://claude.ai/new?q="
                  href="https://claude.ai/new"
                  target="_blank"
                  rel="noopener"
                >
                  <i data-icon="sparkles"></i>
                  <span><strong>Open in Claude</strong><small>Ask questions about this page</small></span>
                </a>
                <a
                  class="menu-item"
                  data-prompt="https://chatgpt.com/?q="
                  href="https://chatgpt.com/"
                  target="_blank"
                  rel="noopener"
                >
                  <i data-icon="sparkles"></i>
                  <span><strong>Open in ChatGPT</strong><small>Ask questions about this page</small></span>
                </a>
                <button class="menu-item" type="button" data-action="mcp" data-if="mcp">
                  <i data-icon="plug"></i>
                  <span><strong>Connect with MCP</strong><small>Copy the claude mcp add command</small></span>
                </button>
                <a class="menu-item" data-action="llms" href="#">
                  <i data-icon="bot"></i>
                  <span><strong>llms.txt</strong><small>Index of every page for agents</small></span>
                </a>
              </div>
            </details>
          </div>
        </div>
        <article class="prose" data-slot="article"></article>
        <nav class="pager" aria-label="Pagination" data-slot="pager" data-if="pager"></nav>
        <footer class="page-footer" data-slot="footer" data-if="footer"></footer>
      </main>

      <aside class="toc" data-if="toc">
        <nav aria-label="On this page" data-if="headings">
          <p class="toc-title">On this page</p>
          <ul data-slot="toc"></ul>
        </nav>
        <section class="toc-tags" aria-label="Tags" data-if="tags">
          <p class="toc-title">Tags</p>
          <ul data-slot="tags"></ul>
        </section>
      </aside>
    </div>

    <div class="scrim" hidden></div>

    <dialog class="search-dialog" aria-label="Search">
      <div class="search-box">
        <i data-icon="search"></i>
        <input
          type="search"
          placeholder="Search documentation"
          aria-label="Search documentation"
          autocomplete="off"
          spellcheck="false"
        />
        <kbd>Esc</kbd>
      </div>
      <div class="search-layout">
        <aside class="search-tags" aria-label="Tags">
          <p class="search-tags-title">Tags</p>
          <ul class="search-tag-list"></ul>
        </aside>
        <div class="search-main">
          <ul class="search-results" role="listbox"></ul>
          <p class="search-status"></p>
        </div>
      </div>
    </dialog>
    <template id="nodeps-editor-template" data-if="editor">
      <dialog class="editor-dialog" aria-label="Page editor">
        <header class="editor-bar">
          <div class="editor-heading">
            <span class="editor-kicker"><i data-icon="square-pen"></i>Editing</span>
            <strong class="editor-page-title"></strong>
            <small class="editor-status" aria-live="polite"></small>
          </div>
          <div class="editor-actions">
            <button type="button" class="pill-button" data-editor="discard" hidden>Discard draft</button>
            <button type="button" class="pill-button" data-editor="close">Close</button>
            <button type="button" class="pill-button primary" data-editor="publish">
              <i data-icon="send"></i>Publish
            </button>
          </div>
        </header>
        <div class="editor-toolbar" role="toolbar" aria-label="Formatting">
          <button
            type="button"
            data-command="formatBlock"
            data-value="p"
            aria-label="Paragraph"
            data-tooltip="Paragraph"
          >
            <i data-icon="pilcrow"></i>
          </button>
          <button type="button" data-command="formatBlock" data-value="h2" aria-label="Heading" data-tooltip="Heading">
            <i data-icon="heading-2"></i>
          </button>
          <button
            type="button"
            data-command="formatBlock"
            data-value="h3"
            aria-label="Subheading"
            data-tooltip="Subheading"
          >
            <i data-icon="heading-3"></i>
          </button>
          <span class="editor-separator"></span>
          <button type="button" data-command="bold" aria-label="Bold" data-tooltip="Bold">
            <strong class="editor-glyph">B</strong>
          </button>
          <button type="button" data-command="italic" aria-label="Italic" data-tooltip="Italic">
            <i data-icon="italic"></i>
          </button>
          <button type="button" data-command="strikeThrough" aria-label="Strikethrough" data-tooltip="Strikethrough">
            <i data-icon="strikethrough"></i>
          </button>
          <button type="button" data-command="code" aria-label="Inline code" data-tooltip="Inline code">
            <i data-icon="code"></i>
          </button>
          <button type="button" data-command="link" aria-label="Link" data-tooltip="Link">
            <i data-icon="link"></i>
          </button>
          <span class="editor-separator"></span>
          <button
            type="button"
            data-command="insertUnorderedList"
            aria-label="Bulleted list"
            data-tooltip="Bulleted list"
          >
            <i data-icon="list"></i>
          </button>
          <button
            type="button"
            data-command="insertOrderedList"
            aria-label="Numbered list"
            data-tooltip="Numbered list"
          >
            <i data-icon="list-ordered"></i>
          </button>
          <button
            type="button"
            data-command="formatBlock"
            data-value="blockquote"
            aria-label="Quote"
            data-tooltip="Quote"
          >
            <i data-icon="text-quote"></i>
          </button>
          <button
            type="button"
            data-command="formatBlock"
            data-value="pre"
            aria-label="Code block"
            data-tooltip="Code block"
          >
            <i data-icon="square-code"></i>
          </button>
          <span class="editor-separator"></span>
          <button type="button" data-command="undo" aria-label="Undo" data-tooltip="Undo">
            <i data-icon="undo-2"></i>
          </button>
          <button type="button" data-command="redo" aria-label="Redo" data-tooltip="Redo">
            <i data-icon="redo-2"></i>
          </button>
          <input class="editor-link-input" type="url" placeholder="Paste a link, then press Enter" hidden />
        </div>
        <div class="editor-scroll">
          <article class="prose editor-content" contenteditable="true" spellcheck="true"></article>
        </div>
        <div class="editor-panel" hidden></div>
      </dialog>
    </template>
  </body>
</html>
