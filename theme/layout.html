<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-slot="title">Documentation</title>
    <script>
      try {
        const theme = localStorage.getItem("theme");
        if (theme) {
          document.documentElement.dataset.theme = theme;
        }
        const presetStyle = localStorage.getItem("theme-preset-style");
        if (presetStyle) {
          document.documentElement.style.cssText = presetStyle;
        }
      } catch {}
    </script>
    <link rel="stylesheet" href="./style.css" />
    <script type="module" src="./client.ts"></script>
  </head>
  <body>
    <a class="skip-link" href="#content">Skip to content</a>

    <header class="site-header">
      <div class="topbar">
        <button
          class="icon-button menu-toggle"
          type="button"
          aria-label="Toggle navigation"
          data-tooltip="Toggle navigation"
          aria-controls="sidebar"
          aria-expanded="false"
        >
          <i data-icon="menu"></i>
        </button>
        <a class="brand" data-slot="brand" href="/"></a>
        <button class="search-trigger" type="button" aria-label="Search documentation" data-tooltip="Search">
          <i data-icon="search"></i>
          <span>Search</span>
          <kbd>⌘K</kbd>
        </button>
        <nav class="header-links" aria-label="External links" data-slot="links"></nav>
        <details class="theme-picker">
          <summary
            class="icon-button"
            aria-label="Choose a theme"
            data-tooltip="Choose a theme"
            data-tooltip-align="end"
          >
            <i data-icon="palette"></i>
          </summary>
          <div class="menu theme-menu" role="menu" data-slot="theme-picker"></div>
        </details>
        <button
          class="icon-button theme-toggle"
          type="button"
          aria-label="Color mode: device"
          data-tooltip="Color mode: device"
          data-tooltip-align="end"
        >
          <i data-icon="monitor"></i>
          <i data-icon="sun"></i>
          <i data-icon="moon"></i>
        </button>
      </div>
      <nav class="category-tabs" aria-label="Sections" data-slot="tabs" data-if="tabs"></nav>
    </header>

    <div class="layout">
      <aside class="sidebar" id="sidebar" data-if="sidebar">
        <nav aria-label="Documentation" data-slot="sidebar"></nav>
      </aside>

      <main class="content" id="content">
        <div class="page-header" data-if="page">
          <span class="breadcrumb" data-slot="breadcrumb"></span>
          <div class="page-actions">
            <button class="copy-page" type="button">
              <i data-icon="copy"></i>
              <i data-icon="check"></i>
              <span>Copy page</span>
            </button>
            <details class="actions-menu">
              <summary aria-label="More page actions" data-tooltip="More page actions" data-tooltip-align="end">
                <i data-icon="chevron-down"></i>
              </summary>
              <div class="menu">
                <a class="menu-item" data-action="markdown" href="#">
                  <i data-icon="file-text"></i>
                  <span><strong>View as Markdown</strong><small>Plain text for LLMs</small></span>
                </a>
                <a
                  class="menu-item"
                  data-prompt="https://claude.ai/new?q="
                  href="https://claude.ai/new"
                  target="_blank"
                  rel="noopener"
                >
                  <i data-icon="sparkles"></i>
                  <span><strong>Open in Claude</strong><small>Ask questions about this page</small></span>
                </a>
                <a
                  class="menu-item"
                  data-prompt="https://chatgpt.com/?q="
                  href="https://chatgpt.com/"
                  target="_blank"
                  rel="noopener"
                >
                  <i data-icon="sparkles"></i>
                  <span><strong>Open in ChatGPT</strong><small>Ask questions about this page</small></span>
                </a>
                <button class="menu-item" type="button" data-action="mcp" data-if="mcp">
                  <i data-icon="plug"></i>
                  <span><strong>Connect with MCP</strong><small>Copy the claude mcp add command</small></span>
                </button>
                <a class="menu-item" data-action="llms" href="#">
                  <i data-icon="bot"></i>
                  <span><strong>llms.txt</strong><small>Index of every page for agents</small></span>
                </a>
              </div>
            </details>
          </div>
        </div>
        <article class="prose" data-slot="article"></article>
        <nav class="pager" aria-label="Pagination" data-slot="pager" data-if="pager"></nav>
        <footer class="page-footer" data-slot="footer" data-if="footer"></footer>
      </main>

      <aside class="toc" data-if="toc">
        <nav aria-label="On this page" data-if="headings">
          <p class="toc-title">On this page</p>
          <ul data-slot="toc"></ul>
        </nav>
        <section class="toc-tags" aria-label="Tags" data-if="tags">
          <p class="toc-title">Tags</p>
          <ul data-slot="tags"></ul>
        </section>
      </aside>
    </div>

    <div class="scrim" hidden></div>

    <dialog class="search-dialog" aria-label="Search">
      <div class="search-box">
        <i data-icon="search"></i>
        <input
          type="search"
          placeholder="Search documentation"
          aria-label="Search documentation"
          autocomplete="off"
          spellcheck="false"
        />
        <kbd>Esc</kbd>
      </div>
      <div class="search-layout">
        <aside class="search-tags" aria-label="Tags">
          <p class="search-tags-title">Tags</p>
          <ul class="search-tag-list"></ul>
        </aside>
        <div class="search-main">
          <ul class="search-results" role="listbox"></ul>
          <p class="search-status"></p>
        </div>
      </div>
    </dialog>
  </body>
</html>
