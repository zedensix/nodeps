name: Pull request

on:
  pull_request:
  # releaser pushes the release PR branch before opening the PR, so its first commit only gets a push run.
  push:
    branches: [releaser/release]

concurrency:
  group: pull-request-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  code-quality:
    uses: $/.github/workflows/code_quality.yml
    permissions:
      contents: read

  docker:
    uses: $/.github/workflows/docker.yml
    permissions:
      contents: read
