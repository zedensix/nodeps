name: Main

on:
  push:
    branches: [main]

concurrency:
  group: main

permissions: {}

jobs:
  code-quality:
    uses: $/.github/workflows/code_quality.yml
    permissions:
      contents: read

  release:
    needs: code-quality
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      released: ${{ steps.release.outputs.released }}
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      # releaser pushes tags (and later the release PR) through origin, so the credentials must persist.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }} # zizmor: ignore[artipacked]
      # Releasing only needs bun: the linters are for the code quality job.
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          cache: false
          install_args: github:oven-sh/bun
      - id: release
        uses: zedensix/releaser@47b2d8752a479df019b4dea98d5bcb2f7b14e221 # v1.7.4
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "false"
        with:
          prerelease: beta
          prepare: mise run release ${version}
          artifacts: build/release/assets/*
      - if: steps.release.outputs.released == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: build/release
          if-no-files-found: error

  docker:
    needs: release
    if: needs.release.outputs.released == 'true'
    uses: $/.github/workflows/docker.yml
    permissions:
      contents: read
    with:
      version: ${{ needs.release.outputs.version }}
      alias: ${{ needs.release.outputs.prerelease == 'true' && 'beta' || 'latest' }}
    secrets:
      dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}

  npm:
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: build/release
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Trusted publishing: npm trades the job's OIDC token for a publish token and adds provenance itself.
      # Until 1.0.0 every beta is `latest`, so a plain install gets it: the token cannot move dist-tags later.
      - name: Publish the platform packages, then the launcher
        run: |
          chmod +x build/release/npm/*/bin/*
          for package in build/release/npm/nodeps-*/ build/release/npm/nodeps; do
            npm publish "$package" --access public --tag latest
          done

  pypi:
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: build/release
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: build/release/pypi

  channels:
    needs: [release, docker, npm, pypi]
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Fails the run when a channel the install docs advertise lacks the release; registries can lag, so each check retries.
      - name: Check every install channel has the release
        env:
          VERSION: ${{ needs.release.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python_version=$(echo "$VERSION" | sed -E 's/-alpha\./a/; s/-beta\./b/; s/-rc\./rc/; s/-[0-9A-Za-z-]+\.([0-9]+)$/.dev\1/')
          missing=0
          check() {
            name=$1
            shift
            for attempt in 1 2 3 4 5 6; do
              if "$@" > /dev/null 2>&1; then
                echo "ok: $name"
                return
              fi
              sleep 20
            done
            echo "::error::$name does not have $VERSION"
            missing=1
          }
          for package in nodeps nodeps-linux-x64 nodeps-linux-arm64 nodeps-linux-x64-musl nodeps-linux-arm64-musl nodeps-darwin-x64 nodeps-darwin-arm64 nodeps-win32-x64; do
            check "npm @zedensix/$package" curl -fsS "https://registry.npmjs.org/@zedensix%2f$package/$VERSION"
          done
          check "PyPI zedensix-nodeps $python_version" curl -fsS "https://pypi.org/pypi/zedensix-nodeps/$python_version/json"
          check "Docker Hub zedensix/nodeps:$VERSION" curl -fsS "https://hub.docker.com/v2/repositories/zedensix/nodeps/tags/$VERSION"
          assets=$(gh release view "v$VERSION" --repo "$REPOSITORY" --json assets --jq '.assets[].name')
          for asset in nodeps-linux-x64 nodeps-linux-arm64 nodeps-linux-x64-musl nodeps-linux-arm64-musl nodeps-darwin-x64 nodeps-darwin-arm64 nodeps-win32-x64.exe SHA256SUMS; do
            check "GitHub release asset $asset (binaries and mise)" grep -qx "$asset" <<< "$assets"
          done
          exit "$missing"
